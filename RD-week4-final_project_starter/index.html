<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Web Project</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h1>My Responsive Photo Gallery</h1>
    </header>

    <main class="container">
        <!-- Yêu cầu 1 & 2: Thay đổi ảnh, thêm alt text và nội dung text mới -->
        <figure>
            <img src="https://picsum.photos" alt="Beautiful mountain landscape with a lake">
            <figcaption>This is a stunning view of the mountains during the golden hour, captured with high detail.</figcaption>
        </figure>

        <figure>
            <img src="https://picsum.photos" alt="Detailed close-up of a green leaf">
            <figcaption>Nature provides the most intricate patterns, as seen in this macro shot of a vibrant leaf.</figcaption>
        </figure>

        <figure>
            <img src="https://picsum.photos" alt="Old classic car on a city street">
            <figcaption>A vintage automobile parked along a quiet street, showing off its classic design and chrome details.</figcaption>
        </figure>

        <figure>
            <img src="https://picsum.photos" alt="Dense forest with tall pine trees">
            <figcaption>The deep forest offers a peaceful escape with its towering trees and fresh, pine-scented air.</figcaption>
        </figure>

        <figure>
            <img src="https://picsum.photos" alt="Coastal view with waves crashing on rocks">
            <figcaption>Powerful ocean waves hit the rocky shore, creating a mist of salt water under the blue sky.</figcaption>
        </figure>
    </main>

    <footer>
        <p>&copy; 2024 Your Name - Web Design Project</p>
    </footer>

</body>
</html>
