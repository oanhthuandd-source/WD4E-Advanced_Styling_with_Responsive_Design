<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Design Final Project</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h1>Modern Nature Gallery</h1>
        <p>A responsive website practicing CSS Grid and Media Queries.</p>
    </header>

    <main class="container">
        <!-- Requirement 1 & 2: New images with alt text and new paragraph content -->
        <figure>
            <img src="https://picsum.photos" alt="Snow-capped mountains under a clear blue sky">
            <figcaption>The majestic peaks of the morning mountains offer a breath of fresh air and a sense of absolute peace for any traveler.</figcaption>
        </figure>

        <figure>
            <img src="https://picsum.photos" alt="A winding river through a green valley">
            <figcaption>A calm river flows gently through the lush green valley, reflecting the sunlight like a silver ribbon on the grass.</figcaption>
        </figure>

        <figure>
            <img src="https://picsum.photos" alt="Waves crashing against a rocky shoreline">
            <figcaption>The powerful ocean waves meet the ancient rocks, creating a dramatic spray of white foam against the deep blue sea.</figcaption>
        </figure>

        <figure>
            <img src="https://picsum.photos" alt="Sunlight filtering through a thick forest">
            <figcaption>Golden sunlight pierces through the dense canopy of the old forest, lighting up the mossy ground below.</figcaption>
        </figure>

        <figure>
            <img src="https://picsum.photos" alt="An eagle soaring high in the sky">
            <figcaption>High above the clouds, the eagle glides with grace and power, watching over the vast landscape from the heavens.</figcaption>
        </figure>

        <figure>
            <img src="https://picsum.photos" alt="A cute pug sitting on a blanket">
            <figcaption>Even in a nature gallery, the small moments like a resting pet bring warmth and joy to our daily lives.</figcaption>
        </figure>
    </main>

    <footer>
        <p>&copy; 2024 Final Web Project. All rights reserved.</p>
    </footer>

</body>
</html>
