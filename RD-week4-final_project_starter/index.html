<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Project</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Final Project Gallery</h1>
    </header>
    <main class="container">
        <figure>
            <img src="https://picsum.photos" alt="Mountain View">
            <figcaption>A beautiful landscape of the high mountains.</figcaption>
        </figure>
        <figure>
            <img src="https://picsum.photos" alt="Green Leaf">
            <figcaption>Macro photography of a vibrant green leaf.</figcaption>
        </figure>
        <figure>
            <img src="https://picsum.photos" alt="Classic Car">
            <figcaption>A vintage car parked on a sunlit street.</figcaption>
        </figure>
        <figure>
            <img src="https://picsum.photos" alt="Pine Forest">
            <figcaption>Tall pine trees in a dense forest during summer.</figcaption>
        </figure>
        <figure>
            <img src="https://picsum.photos" alt="Ocean Shore">
            <figcaption>Rocks along the ocean shore with crashing waves.</figcaption>
        </figure>
    </main>
    <footer>
        <p>&copy; 2026 Web Design Student</p>
    </footer>
</body>
</html>
